<!DOCTYPE html>
<html>
<head>
    <title>Online Temperature Converter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }
        input, select, button {
            padding: 10px;
            margin: 10px;
        }
        .box {
            background: #f5f5f5;
            padding: 20px;
            width: 350px;
            margin: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h2>Online Temperature Converter</h2>

    <div class="box">
        <form method="POST">
            <input type="number" step="any" name="value" placeholder="Enter value" required>
            <select name="scale">
                <option>Celsius</option>
                <option>Fahrenheit</option>
                <option>Kelvin</option>
            </select>
            <button type="submit">Convert</button>
        </form>
    </div>

    {% if result %}
        <h3>Results:</h3>
        <ul>
            {% for key, val in result.items() %}
                <li><b>{{ key }}:</b> {{ val }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
